<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Mod.22 IRC 2025 · Dafilgest</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0f4f8; font-size: 13px; }

.header {
  background: #1e3a5f; color: white; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.header h1 { font-size: 14px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 12px; font-size: 12px; }
.contador { background: rgba(255,255,255,.15); border-radius: 20px; padding: 4px 12px; }
.contador span { color: #fbbf24; font-weight: 700; font-size: 15px; }
.sync { font-size: 11px; color: rgba(255,255,255,.6); }
.sync.ok { color: #86efac; }
.sync.err { color: #fca5a5; }

.progress-wrap { background: #1e3a5f; padding: 0 16px 10px; }
.progress-bar { background: rgba(255,255,255,.2); border-radius: 10px; height: 6px; }
.progress-fill { background: #22c55e; height: 100%; border-radius: 10px; transition: width .4s; }

.toolbar { padding: 8px 12px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; }
.toolbar input { border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 10px; font-size: 12px; flex: 1; outline: none; }
.toolbar input:focus { border-color: #1e3a5f; }
.btn-reset { background: none; border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 10px; font-size: 11px; color: #64748b; cursor: pointer; white-space: nowrap; }
.btn-reset:hover { border-color: #e05050; color: #e05050; }

.lista { padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

.empresa {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 7px;
  background: white; border: 1.5px solid #e2e8f0;
  cursor: pointer; transition: all .15s; user-select: none;
}
.empresa:hover { border-color: #1e3a5f; background: #f8fafc; }
.empresa.feita { background: #f0fdf4; border-color: #86efac; }
.empresa.feita .nome { text-decoration: line-through; color: #6b7280; }
.empresa.feita .nif { color: #86efac; }

.check {
  width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
  border: 2px solid #cbd5e1;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .15s;
}
.empresa.feita .check { background: #22c55e; border-color: #22c55e; color: white; }

.nome { font-size: 12px; font-weight: 500; color: #1e293b; line-height: 1.3; flex: 1; }
.nif { font-size: 10px; color: #94a3b8; font-family: monospace; flex-shrink: 0; }

.loading { text-align: center; padding: 40px; color: #64748b; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <h1>✅ Checklist · Mod. 22 IRC 2025</h1>
  <div class="header-right">
    <div class="contador">Enviadas: <span id="cnt-feitas">0</span> / <span id="cnt-total">0</span></div>
    <span class="sync" id="sync-status">⏳ A ligar...</span>
    <button class="btn-reset" onclick="resetar()">🗑 Limpar</button>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>
<div class="toolbar">
  <input type="text" id="pesquisa" placeholder="🔍 Pesquisar empresa..." oninput="filtrar()">
</div>
<div id="lista" class="lista"><div class="loading">A carregar dados...</div></div>

<script type="module">

  messagingSenderId: "626852328164",
  appId: "1:626852328164:web:fb1848042e65300ee732f1"

const db = getDatabase(app);
const FBREF = ref(db, 'checklist/mod22/2025');

  {n:"HELDER CARNEIRO UNIPESSOAL, LDA",nif:"510397859"},

  {n:"WELCOME GENIALITY UNIPESSOAL, LDA",nif:"515100803"},
];

let estado = {};

function syncStatus(msg, cls) {
  const el = document.getElementById('sync-status');
  el.textContent = msg; el.className = 'sync ' + (cls||'');
}

function atualizar() {
  const feitas = EMPRESAS.filter(e => estado[e.nif]).length;
  const total = EMPRESAS.length;
  document.getElementById('cnt-feitas').textContent = feitas;
  document.getElementById('cnt-total').textContent = total;
  document.getElementById('prog-fill').style.width = Math.round(feitas/total*100) + '%';
}

function render() {
  const lista = document.getElementById('lista');
  lista.innerHTML = EMPRESAS.map((e, i) => `
    <div class="empresa ${estado[e.nif]?'feita':''}" data-i="${i}" data-nome="${e.n.toLowerCase()}" data-nif="${e.nif}" onclick="window.toggle(${i})">
      <div class="check">${estado[e.nif]?'✓':''}</div>
      <div class="nome">${e.n}</div>
      <div class="nif">${e.nif}</div>
    </div>
  `).join('');
  atualizar();
}

window.toggle = function(i) {
  const nif = EMPRESAS[i].nif;
  estado[nif] = !estado[nif];
  const el = document.querySelector(`.empresa[data-i="${i}"]`);
  el.classList.toggle('feita', estado[nif]);
  el.querySelector('.check').textContent = estado[nif] ? '✓' : '';
  atualizar();
  syncStatus('A guardar...', '');
  set(FBREF, estado)
    .then(() => syncStatus('✓ Guardado', 'ok'))
    .catch(() => syncStatus('⚠ Erro ao guardar', 'err'));
};

window.filtrar = function() {
  const q = document.getElementById('pesquisa').value.toLowerCase();
  document.querySelectorAll('.empresa').forEach(el => {
    const ok = !q || el.dataset.nome.includes(q) || el.dataset.nif.includes(q);
    el.style.display = ok ? '' : 'none';
  });
};

window.resetar = function() {
  if (!confirm('Apagar todo o progresso?')) return;
  estado = {};
  set(FBREF, estado).then(() => { render(); syncStatus('✓ Limpo', 'ok'); });
};

// Carregar do Firebase em tempo real
onValue(FBREF, snap => {
  estado = snap.val() || {};
  render();
  syncStatus('✓ Ligado', 'ok');
}, err => {
  syncStatus('⚠ Sem ligação', 'err');
  render();
});
</script>
</body>
</html>
